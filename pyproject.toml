[project]
name = "python-skill-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Riya Kumari", email = "riyaKumari68642@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.2",
    "pydantic>=2.13.4",
    "pypdf>=6.16.2",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=6.0.0",
    "streamlit>=1.62.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
python-skill-agent = "python_skill_agent:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
